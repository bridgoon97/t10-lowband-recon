# Arm A — DDSP / Harmonic+Noise synthesizer
# §3.2: network outputs control params, harmonics generated by oscillator bank
arm: arm_a_ddsp

# --- STFT (§2: win=480/30ms, hop=160/10ms @16kHz; exposed in config) ---
sample_rate: 16000
stft_n_fft: 512
stft_hop: 160
stft_win: 480
keep_bins: 64            # bins 1..64 = 31.25-2000 Hz, DC dropped (DC has dead imag)
stft_window: hann

# --- DDSP-specific ---
n_mel: 16          # spectral envelope dimension (low-dim)
n_bands: 12        # sub-band periodicity (§6.3: per mel-band, NOT scalar)
max_harm: 32       # fixed K_max for static shapes (§6.1)
band_top_hz: 2000   # spec change: anti-alias mask cuts at the BAND top
                    # (0–2 kHz kept), NOT at Nyquist 8 kHz — above 2 kHz is
                    # synthesized-then-truncated = wasted compute
f0_mode: estimated  # estimated | oracle (§6.5: estimate from INPUT, never target)
f0_min: 50.0
f0_max: 400.0
ctrl_hidden: 48
smear_sigma: 2.0   # harmonic smearing width in bins (Hann main lobe)
waveform_synth: true   # spec change: ON by default — amplitude-domain
                        # harmonic Gaussian smear can't produce a complex
                        # spectrum; go oscillator → waveform → STFT → truncate

# --- device / repro ---
device: cpu
seed: 42
deterministic: false

# --- data (L0 simulator for smoke; switch to vibravox for L1) ---
data:
  adapter: lowpass_sim
  segment_len: 16000
  sr: 16000
  n_repeat: 10
  clean_wavs:
    - data/test_speech/clean_00.wav
    - data/test_speech/clean_01.wav
    - data/test_speech/clean_02.wav
    - data/test_speech/clean_03.wav
    - data/test_speech/clean_04.wav  # fill with paths to clean speech wavs
  degradation:
    cutoff_min: 300
    cutoff_max: 1200
    time_vary: true

# --- loss ---
loss:
  l1_weight: 1.0
  l2_weight: 0.5
  db_weight: 1.0
  multi_res_stft: false
  discriminator: false

# --- optimizer / schedule ---
optimizer:
  lr: 3.0e-4
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]
scheduler:
  type: cosine

# --- training ---
batch_size: 4
num_steps: 500
num_workers: 0
log_every: 50
ckpt_every: 250
ckpt_dir: checkpoints/arm_a

# --- AMP ---
amp: false
