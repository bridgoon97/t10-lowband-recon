# Arm B — Spectral regression CRN (GTCRN-style, scaled to 4kHz)
# §3.2: grouped conv + sub-band features + temporal recurrence
arm: arm_b_crn

sample_rate: 16000
stft_n_fft: 512
stft_hop: 160
stft_win: 480
keep_bins: 64            # bins 1..64 = 31.25-2000 Hz, DC dropped
stft_window: hann

device: cpu
seed: 42
deterministic: false

data:
  adapter: lowpass_sim
  segment_len: 4000
  sr: 4000
  n_repeat: 10
  clean_wavs:
    - data/test_speech/clean_00.wav
    - data/test_speech/clean_01.wav
    - data/test_speech/clean_02.wav
    - data/test_speech/clean_03.wav
    - data/test_speech/clean_04.wav
  degradation:
    cutoff_min: 300
    cutoff_max: 1200
    time_vary: true

loss:
  l1_weight: 1.0
  l2_weight: 0.5
  db_weight: 1.0
  multi_res_stft: false
  discriminator: false

optimizer:
  lr: 3.0e-4
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]
scheduler:
  type: cosine

batch_size: 4
num_steps: 500
num_workers: 0
log_every: 50
ckpt_every: 250
ckpt_dir: checkpoints/arm_b

amp: false
